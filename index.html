<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Västerviks stadsbibliotek</title>
<style>
  /* Nunito, fritt typsnitt under SIL Open Font License (vendor/fonts). */
  @font-face { font-family: Nunito; font-weight: 400; font-display: swap;
               src: url("./vendor/fonts/nunito-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: Nunito; font-weight: 700; font-display: swap;
               src: url("./vendor/fonts/nunito-latin-700-normal.woff2") format("woff2"); }
  @font-face { font-family: Nunito; font-weight: 800; font-display: swap;
               src: url("./vendor/fonts/nunito-latin-800-normal.woff2") format("woff2"); }

  :root {
    color-scheme: light;
    --text: #2b2420;
    --text-mjuk: #5a4f47;
    --papper: #fffaf2;
    --kant: #e6dccd;
    --skugga: rgba(90, 70, 50, 0.18);
    --fokus: #6b3a2e;
    --accent: #b9874a;          /* samma som TEMA.senap */
    --accent-mork: #8a6232;
    --typsnitt: Nunito, "Segoe UI", system-ui, sans-serif;
  }
  html, body { margin: 0; height: 100%; background: #f6efe5; overflow: hidden; }
  body { font: 16px/1.45 var(--typsnitt); color: var(--text); }
  #spelduk { display: block; width: 100vw; height: 100vh; outline: none; }

  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--fokus); outline-offset: 3px; }

  kbd {
    display: inline-block; min-width: 1.1em; padding: 0 6px;
    border: 2px solid var(--kant); border-bottom-width: 3px; border-radius: 6px;
    background: #fff; font: 700 13px/1.4 var(--typsnitt); text-align: center;
    color: var(--text-mjuk);
  }

  /* ------------------------------------------------------ hjälpknappen */
  #hjalpknapp {
    position: fixed; left: 16px; bottom: 16px;
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--papper); border: 2px solid var(--kant);
    box-shadow: 0 3px 0 var(--kant);
    font-size: 22px; font-weight: 800; line-height: 1;
  }

  /* ----------------------------------------------- dialogrutan (frågor) */
  #dialog {
    position: fixed; left: 50%; bottom: 24px;
    width: min(460px, calc(100vw - 32px)); box-sizing: border-box;
    padding: 16px 20px 16px; text-align: center;
    background: var(--papper); border: 2px solid var(--kant); border-radius: 18px;
    box-shadow: 0 4px 0 var(--kant), 0 10px 26px var(--skugga);
    transform: translateX(-50%);
    display: none;
  }
  #dialog.syns { display: block; }
  #dialog h2 { margin: 0 0 4px; font-size: 19px; font-weight: 800; }
  #dialog p { margin: 0 0 8px; text-align: left; }
  #dialog p.under { text-align: center; color: var(--text-mjuk); }
  #dialog .knappar { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 12px; }
  .dialogknapp {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 7px 16px; border-radius: 12px;
    background: #fff; border: 2px solid var(--kant);
    font-weight: 800; font-size: 16px;
  }
  .dialogknapp.huvudval { background: #efe2cf; border-color: var(--accent); }

  .i-prick {
    display: inline-grid; place-items: center;
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--accent); color: #fff; border: 2px solid #fff;
    box-shadow: 0 0 0 2px var(--accent);
    font-weight: 800; font-size: 15px; line-height: 1; flex: none;
  }
  .i-prick.stor { width: 30px; height: 30px; font-size: 19px; }
  .info-text p { margin: 0 0 8px; font-size: 15px; }
  .info-text .liten { font-size: 14px; color: var(--text-mjuk); }
  .info-text h4 { margin: 10px 0 4px; font-size: 15px; font-weight: 800; }
  .oppettider { border-collapse: collapse; margin: 4px 0 8px; font-size: 15px; }
  .oppettider caption { text-align: left; font-weight: 800; padding-bottom: 4px; }
  .oppettider th { text-align: left; font-weight: 700; padding: 2px 18px 2px 8px; }
  .oppettider td { padding: 2px 8px; font-variant-numeric: tabular-nums; }
  .oppettider tr.idag { background: #efe2cf; }
  .oppettider tr.idag th, .oppettider tr.idag td { font-weight: 800; }

  /* ---------------------------------------- behovshjulet vid entrén */
  #behov {
    position: fixed; left: 50%; bottom: 24px;
    width: min(620px, calc(100vw - 32px)); box-sizing: border-box;
    padding: 16px 16px 16px; text-align: center;
    background: var(--papper); border: 2px solid var(--kant); border-radius: 18px;
    box-shadow: 0 4px 0 var(--kant), 0 10px 26px var(--skugga);
    transform: translateX(-50%);
    display: none;
  }
  #behov.syns { display: block; }
  #behov h2 { margin: 0 0 4px; font-size: 19px; font-weight: 800; }
  #behov p.under { margin: 0 0 6px; color: var(--text-mjuk); }
  #behov .knappar { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 6px; }
  .behov-hjul { display: flex; align-items: center; gap: 6px; }
  .behov-bana {
    position: relative; flex: 1; height: 104px; overflow: hidden;
    perspective: 700px;
    /* Korten tonar bort mot kanterna, som pa ett hjul som vander sig. */
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent);
            mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent);
  }
  .behov-kort {
    position: absolute; left: 50%; top: 12px;
    width: 140px; height: 80px; margin-left: -70px; box-sizing: border-box;
    display: grid; place-items: center; padding: 6px 10px;
    background: #fff; border: 2px solid var(--kant); border-radius: 14px;
    font-weight: 800; font-size: 15px; line-height: 1.2;
    transition: transform 0.28s ease, opacity 0.28s ease;
  }
  .behov-kort.vald {
    background: #fbf1d6; border-color: #e3b230; box-shadow: 0 3px 0 #e3b230;
  }
  .behov-pil {
    flex: none; width: 40px; height: 40px; border-radius: 50%;
    background: #fff; border: 2px solid var(--kant);
    font-size: 26px; font-weight: 800; line-height: 1; padding: 0 0 3px;
  }
  .behov-status {
    position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);
  }
  @media (max-width: 420px) {
    .behov-kort { width: 120px; margin-left: -60px; font-size: 14px; }
  }

  /* ------------------------------------- mobilen: menyn i stället för pilar */
  #mobil {
    position: fixed; left: 50%; bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    width: min(560px, calc(100vw - 24px)); box-sizing: border-box;
    max-height: 60vh; max-height: 60dvh; overflow-y: auto; overscroll-behavior: contain;
    padding: 14px; text-align: center;
    background: var(--papper); border: 2px solid var(--kant); border-radius: 18px;
    box-shadow: 0 4px 0 var(--kant), 0 10px 26px var(--skugga);
    transform: translateX(-50%);
    display: none;
  }
  #mobil.syns { display: block; animation: mobil-in 0.28s ease-out; }
  /* Medan en fråga eller ett infokort ligger på samma ställe. */
  #mobil.syns.gomd { display: none; }
  @keyframes mobil-in { from { opacity: 0; transform: translate(-50%, 18px); } }
  #mobil h2 { margin: 0 0 2px; font-size: 19px; font-weight: 800; line-height: 1.25; }
  #mobil p { margin: 4px 0 0; }
  #mobil p.under { margin: 0 0 10px; color: var(--text-mjuk); font-size: 15px; }
  .mobil-rutnat { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  @media (min-width: 520px) { .mobil-rutnat { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  /* Liggande mobil: lägre skärm, så fyra val i bredd och lite lägre knappar. */
  @media (min-width: 700px) and (max-height: 500px) {
    #mobil { width: min(760px, calc(100vw - 24px)); }
    .mobil-rutnat { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .mobil-val { min-height: 46px; }
    .mobil-utforska { min-height: 52px; margin: 6px 0 8px; }
  }
  /* "Jag vill utforska själv": bredast och störst, överst i menyn. */
  .mobil-utforska {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 100%; min-height: 68px; margin: 8px 0 12px; padding: 10px 14px; box-sizing: border-box;
    background: #efe2cf; border: 2px solid var(--accent); border-radius: 14px;
    box-shadow: 0 3px 0 var(--accent);
    font-weight: 800; font-size: 18px; line-height: 1.2;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  .mobil-utforska .liten { margin-top: 3px; font-size: 14px; font-weight: 700; color: var(--text-mjuk); }
  .mobil-utforska:active {
    transform: translateY(2px); box-shadow: 0 1px 0 var(--accent-mork);
    background: #fbf1d6;
  }
  .mobil-val {
    min-height: 56px; padding: 8px 10px; box-sizing: border-box;
    background: #fff; border: 2px solid var(--kant); border-radius: 14px;
    box-shadow: 0 3px 0 var(--kant);
    font-weight: 800; font-size: 15px; line-height: 1.2;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  .mobil-val:active {
    transform: translateY(2px); box-shadow: 0 1px 0 #e3b230;
    background: #fbf1d6; border-color: #e3b230;
  }
  #mobil.pavag, #mobil.utforska { text-align: left; padding: 12px 14px; }
  #mobil.pavag h2, #mobil.utforska h2 { font-size: 17px; }
  #mobil.pavag p.under, #mobil.utforska p.under { margin: 0; font-size: 14px; }
  .mobil-rad { display: flex; align-items: center; gap: 12px; }
  .mobil-text { flex: 1; min-width: 0; }
  #mobil .knappar { display: flex; justify-content: center; margin-top: 12px; }
  .mobil-igen { position: relative; overflow: hidden; }
  .mobil-igen > span:last-child { position: relative; }
  /* Fylls medan tiden går, tills figuren går tillbaka av sig själv. */
  .mobil-tid {
    position: absolute; inset: 0; background: rgba(227, 178, 48, 0.32);
    transform-origin: left; animation: mobil-tid linear forwards;
  }
  @keyframes mobil-tid { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  body.mobil #hjalpknapp { display: none; }
  /* Tangenterna i frågorna och infokortet betyder inget på en pekskärm. */
  body.mobil kbd { display: none; }
  body.mobil #spelduk { touch-action: none; }

  /* ------------------------------------------------------------ infokort */
  #infokort {
    /* Samma plats som dialogrutan: allt man läser hamnar på ett ställe. */
    position: fixed; bottom: 24px; left: 50%;
    width: min(460px, calc(100vw - 32px)); box-sizing: border-box;
    max-height: calc(100vh - 140px); overflow-y: auto;
    padding: 16px 20px 12px;
    background: var(--papper);
    border: 2px solid var(--kant); border-radius: 18px;
    box-shadow: 0 4px 0 var(--kant), 0 10px 26px var(--skugga);
    transform: translateX(-50%);
    display: none;
  }
  #infokort.syns { display: block; }
  #infokort .kort-huvud { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  #infokort h2 { margin: 0; font-size: 19px; font-weight: 800; }
  #infokort .kort-fot { display: flex; gap: 10px; justify-content: flex-end; margin-top: 4px; }
  #infokort .stang, .avsluta {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 12px; border-radius: 10px;
    background: #fff; border: 2px solid var(--kant); font-size: 14px; font-weight: 700;
  }

  /* ------------------------------------------------------------ minispel */
  #forlopp, #bokjakt {
    position: fixed; top: 16px; left: 16px;
    padding: 10px 14px 12px; border-radius: 16px;
    background: var(--papper); border: 2px solid var(--kant);
    box-shadow: 0 4px 0 var(--kant);
  }
  #forlopp[hidden], #bokjakt[hidden] { display: none; }
  .forlopp-rubrik { font-weight: 800; font-size: 16px; }
  #forlopp .rakning, #bokjakt .poang { font-variant-numeric: tabular-nums; }
  #bokjakt .poang { display: block; margin-top: 2px; }
  #forlopp .prickrad { display: flex; gap: 6px; margin-top: 8px; }
  #forlopp .prickrad + .prickrad { margin-top: 6px; }
  .forlopp-prick {
    width: 16px; height: 16px; border-radius: 50%; box-sizing: border-box;
    border: 2px solid var(--farg); background: #fff;
  }
  .forlopp-prick.fylld { background: var(--farg); }
  .avsluta { margin-top: 10px; }

  #grattis {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: rgba(60, 45, 30, 0.18);
    visibility: hidden;
  }
  #grattis.syns { visibility: visible; }
  .grattis-kort {
    width: min(420px, 90vw); box-sizing: border-box; text-align: center;
    padding: 22px 26px 20px; border-radius: 18px;
    background: var(--papper); border: 2px solid var(--kant);
    box-shadow: 0 4px 0 var(--kant), 0 16px 40px rgba(60, 45, 30, 0.25);
  }
  .grattis-kort h2 { margin: 2px 0 6px; font-size: 26px; font-weight: 800; }
  .grattis-kort p { margin: 0 0 16px; font-size: 17px; color: var(--text-mjuk); }
  .grattis-kort .knappar { display: flex; gap: 12px; justify-content: center; }
  .grattis-kort button {
    padding: 8px 16px; border-radius: 12px; background: #fff;
    border: 2px solid var(--kant); font-weight: 800; font-size: 16px;
  }
  .grattis-kort button.huvudval { background: #efe2cf; border-color: var(--accent); }

  /* Mjuk övertoning när figuren byter våning. */
  #tona {
    position: fixed; inset: 0; pointer-events: none;
    background: #f6efe5; opacity: 0; transition: opacity 0.25s ease;
  }
  #tona.syns { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  /* --------------------------------------------------------- meddelanden */
  #meddelande {
    position: fixed; top: 16px; left: 50%;
    transform: translateX(-50%);
    display: none; flex-direction: column; align-items: center;
    padding: 8px 20px; border-radius: 14px;
    background: var(--papper); border: 2px solid var(--kant);
    box-shadow: 0 3px 0 var(--kant);
    pointer-events: none; text-align: center;
  }
  #meddelande.syns { display: flex; }
  #meddelande .huvud { font-size: 17px; font-weight: 800; }
  #meddelande .under { font-size: 14px; font-weight: 700; color: var(--text-mjuk); }
</style>
</head>
<body>
<canvas id="spelduk" tabindex="-1" aria-label="3D-vy av biblioteket"></canvas>
<div id="tona" aria-hidden="true"></div>

<div id="meddelande" role="status" aria-live="polite"></div>

<section id="infokort" aria-live="polite" aria-label="Information"></section>

<div id="dialog" role="dialog" aria-labelledby="dialog-rubrik" aria-live="polite"></div>

<div id="behov" role="dialog" aria-labelledby="behov-rubrik"></div>

<div id="mobil" aria-labelledby="mobil-rubrik" aria-live="polite"></div>

<div id="forlopp" role="status" aria-live="polite" aria-label="Biblioteksorientering" hidden></div>

<div id="bokjakt" aria-label="Bokjakten" hidden></div>

<div id="grattis" role="dialog" aria-modal="true" aria-labelledby="grattis-rubrik"></div>

<button id="hjalpknapp" type="button" aria-label="Visa instruktionerna" title="Visa instruktionerna (H)">?</button>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
